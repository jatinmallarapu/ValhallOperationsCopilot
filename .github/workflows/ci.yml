# Model-free checks also exercise the actual PostgreSQL retrieval stack.
name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: make lint
      - run: make test
      - run: make eval
      - run: docker compose up --build --detach
      - run: python scripts/check_compose.py
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
